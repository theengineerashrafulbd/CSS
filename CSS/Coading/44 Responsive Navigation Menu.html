<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Responsive Navigation Menu</title>

		<style>

			.menu{
				background-color: #5F9CA1;
				display: flex;
				justify-content: flex-end;
				
				padding: 10px;
			}

			.menu a{
				padding: 20px;
				text-decoration: none;
				font-size: 20px;
				color: white;
			}

			.menu a:hover{
				background-color: gray;
			}

			@media screen and (max-width: 600px) {
				.menu{
					background-color: chocolate;
					padding: 10px;

					flex-direction: column;
				}

				.menu a{
					background-color: blueviolet;
					margin: 10px 0;
					padding: 10px;
					text-align: center;
					border-radius: 5px;
				}
			}

		</style>

	</head>

	<body>

		<div class="menu">
			<a href="#">Home</a>
			<a href="#">Tuorial</a>
			<a href="#">About Me</a>
			<a href="#">Contact Me</a>
		</div>
		
	</body>
</html>
