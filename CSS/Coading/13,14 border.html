<!DOCType html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<title> Border </title>
		
		<style>
		
			h1{
				border:5px green double;
				width:300px; 
			}
			
			h2{
				Border-width:5px;
				border-color:gray;
				border-style:solid; 
				
				width:300px; 
			}
			
			h3{
				border-left: 5px yellow solid;
				border-right: 5px green solid;
				border-top: 5px red solid;
				border-bottom: 5px black solid;
				
				Border-radius:20px;
				
				width:300px; 
			}
		
		</style>
		
	</head>
	
	<body>
	
		<h1> Bangladesh Beautiful </h1>
		<h2> We Love our country </h2>
		<h3> Life is very short </h3>
		
	</body>

</html>
