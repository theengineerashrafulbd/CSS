<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grid area part 5</title>

        <style>

            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
                text-align: center;
            }

            .container2{
                height: 100vh;
                background-color: #A447A4;
                display: grid;
                grid-template-rows: min-content auto min-content;
                grid-template-areas:
                   'h'
                   'm'
                   'm'
                   'm'
                   'f' 
                ;
           }

           header{
                grid-area: h;
                background-color: aqua;
                width: 100%;
                height: 60px;
                border: 1px solid black;
           }

           main{
            background-color: chocolate;
                grid-area: m;
                width: 100%;
                height: 100%;
           }

           #sec1{grid-area: s1;}
           #sec2{grid-area: s2;}
           #sec3{grid-area: s3;}
           
           #aside1{grid-area: a1;}
           #aside2{grid-area: a2;}
           #aside3{grid-area: a3;}

           #nav1{grid-area: n1;}
           #nav2{grid-area: n2;}

           article{
                display: grid;
                grid-template-areas:
                  's1 a1'
                  's2 a2'
                  's3 a3'  
                ;
                height: 100%;
                margin: 5px 5px 5px 5px;
           }

           section{
                background-color: cornsilk;
                border: 1px solid black;
           }

           aside{
                background-color: cadetblue;
                border: 1px solid black;
           }

           footer{
                grid-area: f;
                width: 100%;
                height: 50px;
                display: grid;
                grid-template-areas: 'n1 n2';
                background-color: darkmagenta;
                border: 1px solid black;
           }



                    /*Grid Layout Responsible*/
           @media screen and (max-width:600px) { 
            
                article{
                    grid-template-areas:
                        's1'
                        'a1'
                        's2'
                        'a2'
                        's3'
                        'a3'  
                    ;
                }
            
                footer{
                    grid-template-areas:
                        'n1'
                        'n2'
                    ;
                }
           }

        </style>

    </head>

    <body>
    
        <div class="container2">

            <header>
                <nav>Header Nav</nav>
            </header>

            <main>
                <article>
                    <section id="sec1">Section1</section>
                    <section id="sec2">Section2</section>
                    <section id="sec3">Section3</section>

                    <aside id="aside1">Aside1</aside>
                    <aside id="aside2">Aside2</aside>
                    <aside id="aside3">Aside3</aside>
                </article>
            </main>

            <footer>
                <nav id="nav1">Nav1</nav>
                <nav id="nav2">Nav2</nav>
            </footer>

        </div>


    </body>
</html>
