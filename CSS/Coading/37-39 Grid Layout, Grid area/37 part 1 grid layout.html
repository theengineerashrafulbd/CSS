<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grid Layout</title>

        <style>

            .grid-container{
                display: grid;
                grid-template-columns: 100px auto auto auto;
                grid-template-rows: 120px 90px 60px auto;
                background-color: burlywood;

                /* grid-column-gap: 10px;
                   grid-row-gap: 5px;
                   grid-gap: 10px 5px; */  /*Its for Gap row/columnm*/
                }

            .grid-container > div{
                background-color: chocolate;
                border: 2px solid black;
                padding: 10px;
                
                display: flex;         /* এই তিনটা text কে মাঝখানে আনার জন্য */
                align-items: center;
                justify-content: center;
            }

            .item1{
                /* grid-column-start: 1;
                   grid-column-end: 3;  */
                /* grid-column: 1 / span 3; */  /* এটা ১ থেকে ৩ নাম্বার কলাম এর পিলার পর্যন্ত জায়গা নিবে */
                
                grid-column: 1 / span 3;        /* এটা ৩ তা কলাম এর জায়গা নিবে */
                grid-row: 1 / 4;
            }

            
        </style>

    </head>

    <body>
    
        <div class="grid-container">

            <div class="item1"> 1 </div>
            <div> 2 </div>
            <div> 3 </div>
            <div> 4 </div>
            <div> 5 </div>
            <div> 6 </div>
            <div> 7 </div>
            <div> 8 </div>
            <div> 9 </div>
            <div> 10 </div>
            <div> 11 </div>
            <div> 12 </div>
            <div> 13 </div>
            <div> 14 </div>
            <div> 15 </div>
            <div> 16 </div>

        </div>
        

    </body>
</html>
