<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Z-index and CSS3 Variable </title>

    <style>

        /* Index Section Started..... */

       :root{
            --primary-color:brown;
            --secondary-color: red;
        } 

        div{
            height: 250px;
            width: 250px;
        }

        .div1{
            background: green;    /* For browser cpmpertable....... */
            background: var(--primary-color);
            position:relative;
            z-index: 2;
        }

        .div2{
           background: red;    /* For browser cpmpertable....... */
           background: var(--secondary-color);
           position: absolute;
           left: 150px;
           top: 150px;
           z-index: 1;
        }

        .index-style{
            float: left;
        }


         /* CSS3 Section Started..... */

         @media screen and (max-width: 600px){
            :root{
            --primary-color: black;
            --secondary-color: yellow;
          } 

         }

    </style>

</head>
<body>
    
    <! Index Section Started..... >
        <div class="index-style">

            <h2> Z-index: </h2>

            
            <div class="div1">

            </div>


            <div class="div2">

            </div>


        </div>

    
<! CSS3 Section Started >

      

</body>
</html>
