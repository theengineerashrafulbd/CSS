<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flex Box Layout</title>

        <style>

            .flex-container{
                background-color: chocolate;
                display: flex;

                /*flex-wrap: wrap;
                flex-direction: column;*/

                flex-flow: wrap row;  /* Warp and Directon দুইটা এক সাথে ব্যবহার করার জন্য */
                justify-content: flex-start;

                height: 300px;
                align-items: flex-start;
            }

            .flex-container > div{
                font-size: 25px;
                margin: 10px;
                padding: 10px;
                width: 100px;
                background-color: darkorange;
            }

        </style>

    </head>

    <body>
    
        <div class="flex-container">

            <div class="div1" style="order: 2; flex-basis: 200px;">
                Div 1
            </div>

            <div class="div2" style="order: 1;">
                Div 2
            </div>

            <div class="div3" style="order: 3;">
                Div 3
            </div>

            <div class="div4" style="order: 4;">
                Div 4
            </div>

            <div class="div5" style="order: 5;">
                Div 5
            </div>

            <div class="div6" style="order: 6;">
                Div 6
            </div>

            <div class="div7" style="order: 7;">
                Div 7
            </div>

            <div class="div8" style="order: 8;">
                Div 8
            </div>

        </div>

    </body>

</html>
