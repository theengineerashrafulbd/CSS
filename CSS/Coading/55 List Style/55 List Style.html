<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>List Style</title>

        <style>

             .list1{
                background-color: darkkhaki;
                padding: 20px;
                font-size: 20px;
             }

             .list1 ul{
                list-style-type: circle;
                list-style-position: inside;
                list-style-image: url(tick.png);


                /*উপরের ৩ টা এক সাথে*/
                /*
                list-style: url(tick.png) inside circle;
                */
             }

             .list1 ul li:hover{
                background-color: azure;
             }

        </style>

    </head>

    <body>

        <div class="list1">
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Python</li>
                <li>jQuery</li>
            </ul>
        </div>

         <div class="list2">
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Python</li>
                <li>jQuery</li>
            </ul>
        </div>
        
    </body>
</html>
