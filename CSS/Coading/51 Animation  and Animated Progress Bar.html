<!DOCType html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>CSS Animation and Animated Progress Bar</title>

		<style>

			*{
				box-sizing: border-box;
			}

			.skil-container{
				background-color: gray;
				width: 500px;
				padding: 20px;
			}

			.skil-container li{
				/*Remove the unodrder list dot*/
				list-style-type: none;

				/*উপরে নিচে margin*/
				margin: 50px 0;

				font-weight: bolder;
				text-transform: uppercase;

				position: relative;
			}


			.skil-container li::before{
				content: '';
				position: absolute;


				/*এটা না দিলে progress bar টা list এর উপর চলে যায়*/
				/*List এর height 100% এর পর আরও 5px নিচে জারগা নেয়*/
				top: calc(100% + 5px);
				left: 0;


				background-color: rgb(170, 167, 173);
				
				/*Progress Bar এর width and height set না করলে progress bar show করবে না*/
				width: 100%;
				height: 25px;

				border-radius: 1000px;
			}

			.skil-container li::after{
				content: '';
				position: absolute;


				/*এটা না দিলে progress bar টা list এর উপর চলে যায়*/
				/*List এর height 100% এর পর আরও 5px নিচে জারগা নেয়*/
				top: calc(100% + 5px);
				left: 0;


				background-color: rgb(249, 249, 250);
				
				/*Progress Bar এর width and height set না করলে progress bar show করবে না*/
				/*width 0 না হলে initial এই color গাড় হএয়া যায়*/
				width: 0%;
				height: 25px;

				border-radius: 1000px;

				/*Animation apply*/
				animation-duration: 3s;
				animation-timing-function: linear;
				animation-delay: ১s;

				/*Fill Mode দিয়ে এই দুইটা off করে দিলে animation হয়ে fill হয়ে থাকবে*/
				/* animation-iteration-count: 3; */
				/* animation-direction: forward; */

				animation-fill-mode: forwards;
			}

			.skil-container li.html::after{
				animation-name: html;
			}
			
			@keyframes html{
				to{
					width: 40%;
				}
			}

			.skil-container li.css::after{
				animation-name: css;
			}
			
			@keyframes css{
				to{
					width: 70%;
				}
			}

			.skil-container li.js::after{
				animation-name: js;
			}
			
			@keyframes js{
				to{
					width: 90%;
					background-color: tomato;
				}
			}

			.skil-container li.py::after{
				animation-name: py;
			}
			
			@keyframes py{
				to{
					width: 50%;
				}
			}

			.skil-container li.c::after{
				animation-name: c;
			}
			
			@keyframes c{
				to{
					width: 30%;
				}
			}

			.skil-container li.bst::after{
				animation-name: bst;
			}
			
			@keyframes bst{
				to{
					width: 60%;
				}
			}

		</style>

	</head>
	
	<body>
	
		<div class="skil-container">
			<ul>
				<li class="html">HTML</li>
				<li class="css">CSS</li>
				<li class="js">JavaScript</li>
				<li class="py">Python</li>
				<li class="c">C++</li>
				<li class="bst">BootStrap</li>
			</ul>
		</div>

	</body>

</html>
